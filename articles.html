<script>
const articlesData = [
  {title:"2025 年必用的 10 款 AI 工具",desc:"从对话助手到视频生成，精选 10 款当前最值得尝试的 AI 工具，覆盖工作、创作、开发全场景。",date:"2025-05-16",url:"articles/ai-tools-2025.html",tags:["工具评测","入门"]},
  {title:"Claude vs ChatGPT：哪个更适合编程？",desc:"作为日常写代码的开发者，我深度对比了 Claude 和 ChatGPT 在编程场景下的实际表现，结论可能出乎意料。",date:"2025-05-14",url:"articles/claude-vs-chatgpt-coding.html",tags:["工具评测","编程"]},
  {title:"零成本搭建个人 AI 工作流",desc:"用免费的工具串联起 AI 写作、翻译、总结、画图的工作流，不花一分钱也能享受 AI 带来的效率提升。",date:"2025-05-10",url:"articles/free-ai-workflow.html",tags:["使用技巧","入门"]}
];
const container = document.getElementById('article-list');
container.innerHTML = '<h2 class="page-title">最新文章</h2>' +
  '<p class="page-desc">精选 AI 相关内容，帮你更好地了解和使用人工智能工具。</p>' +
  articlesData.map(a =>
    '<a class="article-card" href="'+a.url+'">'+
      '<h3>'+a.title+'</h3>'+
      '<div class="meta">'+a.date+'</div>'+
      '<p>'+a.desc+'</p>'+
      '<div style="margin-top:10px;">'+
        a.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+
      '</div>'+
    '</a>'
  ).join('');
</script>
