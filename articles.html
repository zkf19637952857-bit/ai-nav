<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 - AI 导航站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">AI <span>导航站</span></a>
    <nav>
      <a href="/">工具导航</a>
      <a href="articles.html" class="active">文章</a>
      <a href="guestbook.html">留言板</a>
    </nav>
  </div>
</header>

<section class="hero-sm">
  <h1>AI 文章</h1>
  <p style="color:#666;margin-top:8px;">关于人工智能的工具评测、使用技巧和行业观察</p>
</section>

<div class="container">
  <div class="ad ad-banner" onclick="alert('广告位招租 - 联系：example@email.com')">
    &#128640; 广告位 - 让更多用户发现你的 AI 产品
  </div>
</div>

<div class="layout">
  <main>
    <div class="page-section" id="article-list"></div>
  </main>

  <aside class="sidebar">
    <div class="sidebar-ad-wrap">
      <div class="ad ad-sidebar" onclick="alert('广告位招租 - 联系：example@email.com')">
        &#128226; 侧边栏广告<br>300x250
      </div>
    </div>
    <div>
      <div class="sidebar-title">分类</div>
      <ul class="sidebar-links">
        <li><a href="#">工具评测</a></li>
        <li><a href="#">使用技巧</a></li>
        <li><a href="#">行业观察</a></li>
        <li><a href="#">入门教程</a></li>
      </ul>
    </div>
    <div style="margin-top:24px;">
      <div class="sidebar-title">关于</div>
      <p style="font-size:13px;color:#888;line-height:1.7;">AI 导航站致力于收录和推荐优秀的 AI 工具，帮助大家更高效地工作和创作。</p>
    </div>
  </aside>
</div>

<footer>
  <p>AI 导航站 - 持续收录优秀 AI 工具</p>
  <p style="margin-top:4px;">联系：example@email.com</p>
</footer>

<script>
fetch('data/articles.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('article-list');
    container.innerHTML = '<h2 class="page-title">最新文章</h2>' +
      '<p class="page-desc">精选 AI 相关内容，帮你更好地了解和使用人工智能工具。</p>' +
      data.map(a =>
        '<a class="article-card" href="'+a.url+'">'+
          '<h3>'+a.title+'</h3>'+
          '<div class="meta">'+a.date+'</div>'+
          '<p>'+a.desc+'</p>'+
          '<div style="margin-top:10px;">'+
            a.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+
          '</div>'+
        '</a>'
      ).join('');
  });
</script>
</body>
</html>
